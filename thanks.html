<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Request received | Imprezza</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">



<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f0e6;color:#30352c;font:16px/1.7 Arial,sans-serif;padding:30px}main{max-width:560px}.brand{font:32px Georgia,serif;color:#90573f;text-decoration:none}h1{font:48px Georgia,serif;margin:35px 0 20px}p{color:#737366}a.btn{display:inline-block;background:#90573f;color:white;padding:12px 22px;border-radius:5px;text-decoration:none;margin-top:18px}:focus-visible{outline:2px solid #90573f;outline-offset:4px}</style>
</head>
<body>
<main>
  <a class="brand" href="/">IMPREZZA</a>
  <h1 id="h">Request received</h1>
  <p id="p">Thank you. We'll reply within 1 to 2 business days with a proof of your design and the final price. Nothing is charged until you approve it.</p>
  <a class="btn" id="b" href="/">Back to Imprezza</a>
</main>
<script>
(function(){
  var lang = 'en';
  try { lang = localStorage.getItem('imprezza-language') || localStorage.getItem('imprezza-lang') || lang; } catch(e){}
  if (lang === 'es') {
    document.documentElement.lang = 'es';
    document.title = 'Pedido recibido | Imprezza';
    document.getElementById('h').textContent = 'Pedido recibido';
    document.getElementById('p').textContent = 'Gracias. Te respondemos en 1 a 2 días hábiles con una prueba de tu diseño y el precio final. No se cobra nada hasta que lo apruebes.';
    document.getElementById('b').textContent = 'Volver a Imprezza';
  }
})();
</script>
</body>
</html>
